name: Edge Bridge Sync Guardrail

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/edge-bridge-sync.yml'
      - 'rust/crates/api/**'
      - 'rust/crates/runtime/**'
      - 'rust/crates/tools/**'
      - 'edge-bridge/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/edge-bridge-sync.yml'
      - 'rust/crates/api/**'
      - 'rust/crates/runtime/**'
      - 'rust/crates/tools/**'
      - 'edge-bridge/**'

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'edge-bridge/package-lock.json'

      - name: Install Dependencies
        working-directory: edge-bridge
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: edge-bridge
        run: npm run typecheck

      - name: Run Edge Bridge tests
        working-directory: edge-bridge
        run: npm test

      - name: Validate Worker configuration
        working-directory: edge-bridge
        run: npm run deploy:dry-run
