name: Edge Bridge Sync Guardrail

on:
  push:
    branches:
      - main
    paths:
      - 'rust/crates/api/**'
      - 'rust/crates/runtime/**'
      - 'rust/crates/tools/**'
      - 'edge-bridge/**'

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'edge-bridge/package.json'

      - name: Install Dependencies
        working-directory: edge-bridge
        run: npm ci

      - name: Typecheck
        working-directory: edge-bridge
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: edge-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
