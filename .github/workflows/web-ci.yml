name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - tailwind.config.js
      - postcss.config.js
      - edge-bridge/**
      - .github/workflows/web-ci.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - edge-bridge/**

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build frontend
        run: |
          npm ci
          npx vite build
      - name: Embedded HUD bundle is committed and current
        # `onyx daemon` serves rust/crates/onyx/static from inside the binary, so
        # that directory is the only copy of the HUD the daemon can see. It went
        # stale by one React bump and nobody noticed until the served bundle was
        # compared with a fresh build. Fail here instead of shipping the drift.
        run: |
          if [ -n "$(git status --porcelain rust/crates/onyx/static)" ]; then
            echo "::error::rust/crates/onyx/static is stale. Run 'npx vite build' and commit the output."
            git --no-pager diff --stat rust/crates/onyx/static
            git status --porcelain rust/crates/onyx/static
            exit 1
          fi
          echo "Embedded HUD bundle matches a fresh build of src/."
      - name: Typecheck and build edge-bridge
        working-directory: edge-bridge
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build
