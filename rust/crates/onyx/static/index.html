<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXiM Onyx Mk3 Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --primary: #3b82f6;
            --panel-bg: #1e293b;
            --border: #334155;
            --accent: #10b981;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }
        .dashboard-container {
            display: flex;
            width: 100%;
            gap: 20px;
        }
        .chat-panel {
            flex: 2;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .telemetry-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.2em;
            background: rgba(0,0,0,0.2);
        }
        .chat-history {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 6px;
            max-width: 80%;
        }
        .user-message {
            background: var(--primary);
            align-self: flex-end;
        }
        .ai-message {
            background: var(--border);
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--border);
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            outline: none;
        }
        button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2563eb;
        }
        .metric-card {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
        }

        .health-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            color: #fff;
            font-weight: bold;
            text-transform: capitalize;
        }

    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="chat-panel">
            <div class="header">Onyx Mk3 Terminal</div>
            <div class="chat-history" id="chatHistory">
                <div class="message ai-message">Onyx Mk3 Online. Ready for prompt.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Enter command..." />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        <div class="telemetry-panel">
            <div class="header">Fleet Telemetry</div>
            <div class="metric-card">
                <div>Active Nodes</div>
                <div class="metric-value" id="activeNodes">--</div>
            </div>
            <div class="metric-card">
                <div>Global Error Rate</div>
                <div class="metric-value" id="errorRate">--%</div>
            </div>

            <div class="metric-card">
                <div>Provider Health</div>
                <div id="providerHealthContainer" style="display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;">
                    <span class="health-badge" style="background: var(--accent);">Anthropic</span>
                </div>
            </div>

            <div class="metric-card">
                <div>Edge Bridge Status</div>
                <div class="metric-value" id="bridgeStatus" style="color: #3b82f6;">Connected</div>
            </div>
        </div>
    </div>



    <script>
        const chatHistory = document.getElementById('chatHistory');
        const input = document.getElementById('chatInput');
        const bridgeStatus = document.getElementById('bridgeStatus');

        let eventSource = null;
        let reconnectDelay = 1000;
        const MAX_RECONNECT_DELAY = 30000;
        const seenMessageIds = new Set();
        let pingInterval = null;

        function connect() {
            // Using SSE instead of WebSocket
            eventSource = new EventSource('/api/v1/chat');

            eventSource.onopen = () => {
                reconnectDelay = 1000;
                bridgeStatus.innerText = 'Connected';
                bridgeStatus.style.color = 'var(--accent)';

            };

            eventSource.onmessage = (event) => {
                try {
                    // Check if event data is JSON or simple text
                    let data;
                    try {
                        data = JSON.parse(event.data);
                    } catch (e) {
                        data = { type: 'text', content: event.data };
                    }

                    if (data === '[DONE]' || event.data === '[DONE]') return;

                    // Deduplication
                    if (data.id && seenMessageIds.has(data.id)) return;
                    if (data.id) seenMessageIds.add(data.id);

                    if (data.type === 'text') {
                        appendMessage('ai-message', data.content);
                    } else if (data.type === 'telemetry') {
                        document.getElementById('activeNodes').innerText = data.activeNodes || '--';
                        document.getElementById('errorRate').innerText = (data.errorRate || '0.00') + '%';

                        if (data.providerHealth) {
                            updateProviderHealth(data.providerHealth);
                        }
                    } else {
                        // Just append normal message
                        if (data.content) {
                            appendMessage('ai-message', data.content);
                        } else if (typeof data === 'string') {
                            appendMessage('ai-message', data);
                        }
                    }
                } catch(e) {
                    console.error("Error processing SSE message", e);
                }
            };

            eventSource.onerror = (err) => {
                bridgeStatus.innerText = 'Disconnected (Reconnecting...)';
                bridgeStatus.style.color = '#ef4444';
                eventSource.close();

                setTimeout(() => {
                    reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
                    connect();
                }, reconnectDelay);
            };
        }

        // Also support sending messages via fetch to the same or a different endpoint
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user-message', text);
            input.value = '';

            try {
                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (!response.ok) {
                    appendMessage('ai-message', 'Error sending message');
                }
            } catch (e) {
                appendMessage('ai-message', 'Network error');
            }
        }

        connect();

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(className, text) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function updateProviderHealth(healthObj) {
            const container = document.getElementById('providerHealthContainer');
            if (!container) return;

            container.innerHTML = '';
            for (const [provider, isHealthy] of Object.entries(healthObj)) {
                if (provider === 'status') continue;
                const badge = document.createElement('span');
                badge.className = 'health-badge';
                badge.style.backgroundColor = isHealthy ? 'var(--accent)' : '#ef4444';
                badge.innerText = provider;
                container.appendChild(badge);
            }
        }
    </script>


</body>
</html>
